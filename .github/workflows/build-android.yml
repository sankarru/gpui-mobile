name: Build Android .so lib (aarch64)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-lib:
    name: Build .so lib aarch64
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install Rust + cargo-ndk
        run: |
          rustup set profile minimal
          rustup toolchain install stable
          rustup target add aarch64-linux-android
          rustup default stable
          cargo install cargo-ndk

      - name: Download Android NDK directly
        run: |
          NDK_URL="https://dl.google.com/android/repository/android-ndk-r29-linux.zip"
          curl -fLo /tmp/ndk.zip "$NDK_URL"
          unzip -q /tmp/ndk.zip -d /opt
          echo "ANDROID_NDK_HOME=/opt/android-ndk-r29" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=/opt/android-ndk-r29" >> "$GITHUB_ENV"

      - name: Build .so library
        run: |
          cd example
          cargo ndk -t arm64-v8a -P 26 \
            -o android/gradle/app/src/main/jniLibs \
            build --release --lib

      - name: Verify .so
        run: |
          find example/android/gradle/app/src/main/jniLibs -name "*.so" -exec ls -lh {} \;

      - name: Upload .so library
        uses: actions/upload-artifact@v4
        with:
          name: gpui-mobile-lib-aarch64-${{ github.sha }}
          path: example/android/gradle/app/src/main/jniLibs/**/*.so
          if-no-files-found: error
