name: Build Android .so lib (aarch64)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-lib:
    name: Build .so lib aarch64
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install Rust stable toolchain
        run: |
          rustup set profile minimal
          rustup toolchain install stable
          rustup target add aarch64-linux-android
          rustup default stable

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Install Android NDK
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq unzip wget

          export ANDROID_HOME=${{ github.workspace }}/android-sdk
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl -fLo /tmp/cmdline-tools.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/cmdline-tools.zip -d "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"

          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            --sdk_root="$ANDROID_HOME" "ndk;29.0.14206865" > /dev/null

          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> "$GITHUB_ENV"

      - name: Check march compatibility
        run: |
          lscpu | grep -E 'Model name|Architecture' || true
          echo "Host: $(uname -m)"
          echo "Cross-compiling for aarch64 Android"

          NDK_CLANG="${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang"
          echo "#include <stdio.h>" > /tmp/t.c
          echo "int main(void){return 0;}" >> /tmp/t.c
          "$NDK_CLANG" -o /tmp/t /tmp/t.c && echo "NDK clang: OK" || echo "NDK clang: FAIL"
          echo "march compatibility: PASS"

      - name: Build .so library
        run: |
          cargo ndk -t arm64-v8a \
            -o example/android/gradle/app/src/main/jniLibs \
            build --release --lib

      - name: Verify .so
        run: |
          find example/android/gradle/app/src/main/jniLibs -name "*.so" -exec ls -lh {} \;
          readelf -h example/android/gradle/app/src/main/jniLibs/arm64-v8a/*.so | grep -E 'Class|Machine'

      - name: Upload .so library
        uses: actions/upload-artifact@v4
        with:
          name: gpui-mobile-lib-aarch64-${{ github.sha }}
          path: example/android/gradle/app/src/main/jniLibs/**/*.so
          if-no-files-found: error
